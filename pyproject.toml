[project]
name = "coffee-contracts"
version = "2.2.0"
description = "Versioned event contracts shared by the coffee services."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_contracts"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "CPY001", # house rule: no copyright headers in code
    "D100",   # house rule: files never start with a docstring
    "D104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "ANN201", "SLF001", "ARG", "FBT", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
