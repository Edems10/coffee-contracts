name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The compatibility test reads the schemas as they were at the last
          # release tag. A shallow checkout has no tags, and the test fails
          # rather than skipping — a skip exits 0, which is the same as not
          # having the check at all.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  version:
    name: version moved and changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's own head, not the merge commit, so the version read is the branch's.
          ref: ${{ github.event.pull_request.head.sha }}
          # origin/main must exist in the checkout to compare against it.
          fetch-depth: 0
      - name: read the version on origin/main
        run: git show origin/main:pyproject.toml > "$RUNNER_TEMP/base-pyproject.toml"
      - run: python3 .github/scripts/check_version.py "$RUNNER_TEMP/base-pyproject.toml"
