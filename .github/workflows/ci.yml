name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The compatibility test reads the schemas as they were at the last
          # version tag. A shallow checkout has no tags, and the test would
          # skip itself — green, and checking nothing.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run pre-commit run --all-files --show-diff-on-failure
